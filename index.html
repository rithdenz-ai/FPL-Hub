<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FPLWIZ</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="app-header">
    <div class="header-inner">
      <span class="header-brand">FPLWIZ</span>
      <button class="header-menu-btn" aria-label="Menu">
        <span>Menu</span>
        <i class="fas fa-bars"></i>
      </button>
    </div>
    </header>

    <!-- GW LIVE STATUS BADGE -->
  <div class="gw-live-banner">
    <div class="gw-live-badge">
      <span class="live-dot"></span>
      <span id="gw-status-text">Connecting to Official FPL...</span>
    </div>
  </div>

  <!-- SIDE DRAWER NAVIGATION -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <nav class="side-drawer" id="sideDrawer">
    <div class="drawer-header">
      <span class="drawer-brand">FPLWIZ</span>
      <button class="drawer-close-btn" id="drawerCloseBtn" aria-label="Close Menu">
        <i class="fas fa-times"></i>
      </button>
    </div>
    <ul class="drawer-menu">
      <li><a href="#"><i class="fas fa-chart-line"></i> Manager Dashboard</a></li>
      <li><a href="#"><i class="fas fa-database"></i> Player Directory</a></li>
      <li><a href="#"><i class="fas fa-exchange-alt"></i> Player Comparison</a></li>
      <li><a href="#"><i class="fas fa-calendar-alt"></i> Fixture Schedule</a></li>
      <li><a href="#"><i class="fas fa-robot"></i> AI Recommended XI</a></li>
      <li><a href="#"><i class="fas fa-history"></i> Season Tracker</a></li>
      <li class="drawer-divider"></li>
      <li><a href="#" class="drawer-auth-btn"><i class="fas fa-sign-in-alt"></i> Sign In / Sign Out</a></li>
    </ul>
  </nav>

  <script src="app.js"></script>
</body>
</html>
